# Runtime-only pyproject for the .mcpb bundle.
# No [build-system]: uv treats this as a virtual project and installs dependencies
# instead of building the package, which keeps bundle start-up fast and path-agnostic.
[project]
name = "podcast-leads-mcp"
version = "0.1.0"
description = "MCP server for the Podcast Leads API - find podcast host emails by keyword."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

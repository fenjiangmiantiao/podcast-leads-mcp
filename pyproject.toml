[project]
name = "podcast-leads-mcp"
version = "0.1.0"
description = "MCP server for the Podcast Leads API - find podcast host emails by keyword."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
podcast-leads-mcp = "podcast_leads_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_leads_mcp"]
